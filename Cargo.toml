[package]
name = "savevault"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
md5 = "0.7"
chrono = "0.4"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
winreg = "0.52"
aes = "0.8"
base64 = "0.22"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
image = "0.25"
